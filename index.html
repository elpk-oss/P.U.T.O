<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PUTO</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #111 0%, #000 70%);
  font-family: Arial, Helvetica, sans-serif;
  overflow:hidden;
}

.texto{
  font-size: 12vw;
  font-weight: 900;
  letter-spacing: 1vw;
  color: #fff;
  text-transform: uppercase;
  text-align:center;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  0%{
    text-shadow:
      0 0 10px #00f0ff,
      0 0 20px #00f0ff,
      0 0 40px #00f0ff,
      0 0 80px #00f0ff;
  }
  100%{
    text-shadow:
      0 0 20px #ff00c8,
      0 0 40px #ff00c8,
      0 0 60px #ff00c8,
      0 0 100px #ff00c8;
  }
}
</style>
</head>
<body>
  <div class="texto">PUTO</div>
</body>
</html>
